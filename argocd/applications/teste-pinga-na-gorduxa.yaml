apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teste-pinga-na-gorduxa
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/geni-junior/teste-pinga-na-gorduxa.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
