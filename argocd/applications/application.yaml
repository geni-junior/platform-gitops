apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-hello-nodejs
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/geni-junior/app-hello-nodejs.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
